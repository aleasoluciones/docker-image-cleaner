name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Check go.mod/go.sum are tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Check formatting
      run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)

    - name: Vet
      run: go vet ./...

    - name: Staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
        staticcheck ./...

    - name: Build
      run: CGO_ENABLED=0 go build ./...

  package:
    runs-on: ubuntu-latest
    needs: check

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Build .deb package
      run: docker build --build-arg VERSION=0.0.0-ci -o out .

    - name: Test package installation
      run: |
        docker run --rm -v "$PWD/out:/stuff:ro" debian:bookworm-slim \
          bash -c 'dpkg -i /stuff/*.deb && /usr/local/sbin/docker-image-cleaner -h'
